submission:
  title: "Grid Guard — Power Outage Prediction & Grid Equipment Failure Advisor"

  problem_statement: >
    Utility operators today rely on calendar-driven, break-fix maintenance schedules
    that ignore the real-time signals embedded in asset sensor data. Equipment failure
    signatures — abnormal vibration, temperature excursions, insulation degradation —
    appear weeks before a fault occurs, yet go undetected and unacted upon. Weather
    events such as heat domes, ice storms, and high winds compound stress on already
    marginal assets, but weather forecasts and historical incident records are never
    correlated with live sensor streams in time to intervene. The result is costly,
    preventable blackouts and reactive crew dispatches that could have been avoided
    with earlier, data-driven decision support.

  solution_summary: >
    Grid Guard is an end-to-end decision-support system that fuses asset sensor
    telemetry, multi-day weather forecasts, and historical outage incident records
    into a unified Neon Postgres pipeline. An XGBoost classification model is trained
    on this combined dataset to produce per-asset failure risk scores, with SHAP-based
    feature-importance explainability so operators understand why each asset is flagged.
    Assets are then ranked by a composite grid-impact severity score — failure
    probability multiplied by customers served and criticality tier — so crews focus
    first where the consequences are greatest. IBM Bob powered by watsonx.ai consumes
    the ranked risk list and generates a prioritised, plain-English maintenance
    schedule and crew pre-positioning plan that field teams can act on immediately.

  key_features:
    - "Multi-source data fusion (sensor telemetry + weather + incident history) via a Neon Postgres pipeline"
    - "XGBoost-based failure risk prediction with SHAP feature-importance explainability"
    - "Grid-impact severity ranking (failure probability × customers served × criticality tier)"
    - "IBM Bob/watsonx.ai generated natural-language maintenance and crew dispatch plan"
    - "Interactive Streamlit dashboard showing at-risk assets, rankings, and recommended actions"

  tech_stack:
    languages: ["Python"]
    frameworks: ["FastAPI", "Streamlit"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "ibm-watsonx-ai SDK"]
    databases: ["PostgreSQL (Neon)"]
    other: ["XGBoost", "SHAP", "scikit-learn", "pandas", "Plotly", "SQLAlchemy"]

  what_we_are_most_proud_of: >
    The end-to-end data fusion pipeline that combines live asset sensor telemetry,
    multi-day weather forecasts, and historical outage records into a single feature
    matrix — and the SHAP-based explainability layer that makes each risk score
    transparent and actionable for field operators rather than a black-box number.

  known_limitations: >
    Sensor telemetry and weather data are currently simulated/synthetic rather than
    sourced from a live utility SCADA system. The crew dispatch optimisation uses a
    greedy severity ranking rather than a full route-optimisation solver. The demo
    environment uses a shared Neon Postgres instance and is not sized for production
    load volumes.

